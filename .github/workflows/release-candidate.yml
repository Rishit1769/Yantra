name: Release Candidate Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-candidate.yml"
      - "docs/development/developer-preview-policy.md"
      - "docs/development/release-artifact-verification.md"
      - "docs/development/releasing.md"
      - "docs/features/**"
      - "docs/getting-started/**"
      - "docs/guides/**"
      - "examples/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }} --locked --all-groups
          uv lock --check

      - name: Test
        run: uv run --locked python -m pytest -q

      - name: Verify offline developer commands
        run: |
          uv run --locked yantra --version
          uv run --locked yantra --help
          uv run --locked yantra doctor
          uv run --locked yantra providers
          uv run --locked yantra models
          uv run --locked yantra quickstart
          uv run --locked yantra-smoke offline
          uv run --locked python examples/agent_loop_offline.py
          uv run --locked python examples/secure_tool_policy.py
          uv run --locked python examples/secure_tool_approval.py
          uv run --locked python examples/secure_tool_boundaries.py

  package:
    name: Build, install, and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install locked tooling
        run: |
          uv python install 3.12
          uv sync --python 3.12 --locked --all-groups

      - name: Run static checks and dependency audit
        run: |
          uv lock --check
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          uv audit --locked

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist --out-dir dist

      - name: Verify archive metadata, contents, and checksums
        run: uv run --locked python scripts/verify_release_artifacts.py --dist dist

      - name: Install and smoke-test wheel outside the checkout
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/yantra-wheel"
          uv pip install --python "$RUNNER_TEMP/yantra-wheel/bin/python" "$GITHUB_WORKSPACE/dist/yantra-0.2.0-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/yantra-wheel/bin/yantra" --version
          "$RUNNER_TEMP/yantra-wheel/bin/yantra" doctor
          "$RUNNER_TEMP/yantra-wheel/bin/yantra" providers
          "$RUNNER_TEMP/yantra-wheel/bin/yantra" models
          "$RUNNER_TEMP/yantra-wheel/bin/yantra" quickstart
          "$RUNNER_TEMP/yantra-wheel/bin/yantra-smoke" offline

      - name: Install and smoke-test source distribution outside the checkout
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/yantra-sdist"
          uv pip install --python "$RUNNER_TEMP/yantra-sdist/bin/python" "$GITHUB_WORKSPACE/dist/yantra-0.2.0.tar.gz"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/yantra-sdist/bin/yantra" --version
          "$RUNNER_TEMP/yantra-sdist/bin/yantra" quickstart
          "$RUNNER_TEMP/yantra-sdist/bin/yantra-smoke" offline

      - name: Upload release-candidate artifacts (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yantra-${{ github.sha }}
          path: |
            dist/yantra-0.2.0-py3-none-any.whl
            dist/yantra-0.2.0.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
